# Az indikátor-aréna teljes historikus mérése (spec/11, Fázis 2).
#
# Nem a tulajdonos gépén fut: 620 papír húsz éve nem fér el kényelmesen 8 GB
# memóriában. A napló nyilvános, ezért csak darabszám és összefoglaló kerül
# bele — mért találati arány nem, az a belépés mögé megy.
name: Arena

on:
  schedule:
    # Vasárnap 10:00 UTC: a heti tanítás (08:00) után, hogy ne fussanak egyszerre.
    - cron: "0 10 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = számol, de nem ír"
        type: boolean
        default: false
      scope:
        description: "all = minden aréna, crypto = csak a kripto-, fx = csak a deviza-, bonds = csak a kötvény-arénák"
        type: choice
        options: [all, crypto, fx, bonds, practice]
        default: all

permissions:
  contents: read

concurrency:
  group: arena
  cancel-in-progress: false

jobs:
  # Egyetlen job, sorban (docs/terv-egress.md a privát repóban): a lépések a
  # gép lemezén közösen használják a letöltött árfolyamot, így a 20 év egyszer
  # jön le, nem nyolcszor. A sorrend nem számít; egy lépés hibája után a
  # többi még lefut (a job a végén hibásként jelez).
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: uv sync --frozen --no-dev
      - name: Futáson belüli tároló-gyorsítótár és változásnapló (docs/terv-egress.md, J1–J2)
        # Csak az ideiglenes gépen él: futások között nincs cache, mert a publikus
        # repó cache-éből egy idegen pull request a nyers adatot is visszaolvashatná.
        run: |
          echo "CALYZE_STORAGE_CACHE=$RUNNER_TEMP/storage-cache" >> "$GITHUB_ENV"
          echo "CALYZE_CHANGES_FILE=$RUNNER_TEMP/changes.txt" >> "$GITHUB_ENV"
      - name: A teljes indikátor-aréna
        if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.scope == 'all') }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: uv run python -m pipeline.arena.run $DRY_RUN
      - name: Minta-aréna (támasz-ellenállás, gyertyaminták, váll-fej-váll)
        if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.scope == 'all') }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: uv run python -m pipeline.patterns.run $DRY_RUN
      - name: Konfluencia-motor
        if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.scope == 'all') }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: uv run python -m pipeline.confluence.run $DRY_RUN
      - name: Hír-aréna
        if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.scope == 'all') }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: uv run python -m pipeline.newsarena.run $DRY_RUN
      - name: Kripto indikátor-, minta- és hír-aréna
        if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.scope == 'all' || inputs.scope == 'crypto') }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: uv run python -m pipeline.crypto.arenas
      - name: Deviza indikátor-, minta- és hír-aréna
        if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.scope == 'all' || inputs.scope == 'fx') }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: uv run python -m pipeline.fx.arenas
      - name: Kötvény indikátor-, minta- és hír-aréna
        if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.scope == 'all' || inputs.scope == 'bonds') }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: uv run python -m pipeline.bonds.arenas
      - name: Kalibrációs edzés (kérdésbank)
        if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.scope == 'all' || inputs.scope == 'practice') }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: uv run python -m pipeline.practice.build
