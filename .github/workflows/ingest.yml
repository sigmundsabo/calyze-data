# Napi árfolyam-letöltés és feature-számítás a privát tárba (spec/05, 5. fejezet).
# A futás naplója nyilvános: csak darabszám és forrásnév kerül bele, ár soha.
name: Ingest

on:
  schedule:
    # Hétköznap 22:30 UTC: a NYSE zárása (20:00 / 21:00 UTC) után bőven.
    # A GitHub ütemezése terhelésnél késhet (spec/05, 9. fejezet, 5. sor), és
    # a forrás az előző napot néha csak órákkal később adja ki: ezért még
    # ötször, a következő nyitás (13:30 / 14:30 UTC) előtt. A becslés egyszer
    # mentődik; nyitás után már nem készül (docs/elo-futas.md).
    - cron: "30 22 * * 1-5"
    - cron: "30 0 * * 2-6"
    - cron: "30 2 * * 2-6"
    - cron: "30 5 * * 2-6"
    - cron: "30 9 * * 2-6"
    - cron: "30 12 * * 2-6"
    # Vasárnap teljes újratöltés: a forrás visszamenőleges igazításai ellen.
    - cron: "0 6 * * 0"
  workflow_dispatch:
    inputs:
      mode:
        description: "daily = utolsó 10 session, backfill = teljes múlt 2005-től"
        type: choice
        options: [daily, backfill]
        default: daily

permissions:
  # A napi lenyomat (hash) commitolásához írás kell a repóba.
  contents: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    # A teljes múlt (backfill) 1585 papírra 2005-től helyben kb. 50 perc volt
    # (2026-10-19); a napi futás néhány perc.
    timeout-minutes: 120
    env:
      # Munka-szintű változó, hogy a lépés `if` feltétele is lássa.
      HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: uv sync --frozen --no-dev
      - name: Futáson belüli tároló-gyorsítótár és változásnapló (docs/terv-egress.md, J1–J2)
        # Csak az ideiglenes gépen él: futások között nincs cache, mert a publikus
        # repó cache-éből egy idegen pull request a nyers adatot is visszaolvashatná.
        run: |
          echo "CALYZE_STORAGE_CACHE=$RUNNER_TEMP/storage-cache" >> "$GITHUB_ENV"
          echo "CALYZE_CHANGES_FILE=$RUNNER_TEMP/changes.txt" >> "$GITHUB_ENV"
      - name: Letöltés
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          MODE: ${{ inputs.mode || (github.event.schedule == '0 6 * * 0' && 'backfill') || 'daily' }}
        run: uv run python -m pipeline.ingest.run --mode "$MODE"
      - name: Feature-ök és rezsim
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          MODE: ${{ inputs.mode || (github.event.schedule == '0 6 * * 0' && 'backfill') || 'daily' }}
        run: uv run python -m pipeline.features.run --mode "$MODE"
      - name: Napi becslés (a megjelenítés előtt mentve)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: uv run python -m pipeline.forecast.run --manifest-dir manifests
      - name: A napi lenyomat commitolása
        # Csak a hash és a darabszámok kerülnek a publikus repóba; maga a
        # becslés-csomag a privát tárban marad (commit–reveal). Közvetlenül a
        # becslés után: 2026-09-29-én a megjelenítés egy átmeneti hibán elbukott,
        # és az utána álló commit-lépés a mentett csomag lenyomatát elnyelte.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifests manifests-arena
          if git diff --cached --quiet; then
            echo "nincs uj lenyomat"
            exit 0
          fi
          git commit -m "forecast manifest"
          git pull --rebase --autostash
          git push
      - name: A lejárt becslések kiértékelése
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: uv run python -m pipeline.resolve.run
      - name: Megjelenítési JSON-ok a webappnak
        # A becslés már mentve és lenyomatolva van; ez csak átfordítja abba a
        # formába, amit a felület olvas. Nem publikus tárolóba megy.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: uv run python -m pipeline.publish.run
      - name: Eletjel a figyelonek
        # „Halott ember kapcsoló”: ha ez a ping elmarad, a figyelő riaszt.
        if: ${{ success() && env.HEALTHCHECK_URL != '' }}
        run: curl -fsS -m 10 --retry 3 "$HEALTHCHECK_URL" > /dev/null && echo "ping elkuldve"
